<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KeyBlitz</title>

  <!-- Fonts (optional: the page falls back to system fonts when offline) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main>

    <!-- ===== Header ===== -->
    <header class="header">
      <h1 class="brand" id="brand" hidden>
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2.5"/>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
          </svg>
        </span>
        <span class="gradient-text">KeyBlitz</span>
      </h1>

      <div class="toolbar">
        <!-- Log out (shown after login) -->
        <button class="icon-btn" id="logout-btn" aria-label="Log out" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>

        <!-- Sound on/off (icon is swapped by script.js) -->
        <button class="icon-btn" id="sound-btn" aria-label="Toggle sound"></button>

        <!-- Light/dark theme (icon is swapped by script.js) -->
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
      </div>
    </header>

    <!-- ===== Login screen ===== -->
    <section class="glass login-card" id="login">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 8l-5 4 5 4"/>
          <path d="M16 8l5 4-5 4"/>
          <path d="M14 5l-4 14"/>
        </svg>
      </div>
      <h2>Welcome, coder!</h2>
      <p class="muted">Choose a nickname to log in and start typing.</p>

      <input id="nickname" maxlength="16" autocomplete="off" placeholder="Nickname (2 to 16 characters)">
      <button id="login-btn" disabled>Log in &amp; Play</button>
    </section>

    <!-- ===== Game screen ===== -->
    <div id="app" hidden>
      <p class="subtitle" id="subtitle"></p>

      <!-- Live stats -->
      <div class="stats">
        <div class="glass stat"><b id="timer">60</b><span>seconds</span></div>
        <div class="glass stat"><b id="wpm">0</b><span>wpm</span></div>
        <div class="glass stat"><b id="accuracy">100%</b><span>accuracy</span></div>
        <div class="glass stat"><b id="snippets">0</b><span>snippets</span></div>
      </div>

      <!-- Difficulty -->
      <div class="levels">
        <button class="level-btn" data-level="easy"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>Easy</button>
        <button class="level-btn" data-level="medium"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>Medium</button>
        <button class="level-btn" data-level="hard"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Hard</button>
      </div>

      <p class="best-line" id="best"></p>

      <!-- Time-left bar -->
      <div class="progress"><i class="progress-fill" id="progress"></i></div>

      <!-- Typing window -->
      <div class="glass window" id="game">
        <div class="titlebar">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
          <span class="filename" id="filename"></span>
          <span class="combo" id="combo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><span id="combo-count">0</span></span>
        </div>

        <div class="editor">
          <div class="gutter">1</div>
          <div class="code" id="code"></div>
        </div>

        <div class="popup" id="popup"></div>

        <div class="input-wrap">
          <input id="typing-input" placeholder="start typing..."
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>

      <!-- Results (shown when time is up) -->
      <div class="glass result" id="result" hidden></div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
